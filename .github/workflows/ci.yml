name: Portfolio CI

on:
  workflow_dispatch:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: portfolio-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Use npm 11.19.1
        run: npm install --global npm@11.19.1

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: UI and navigation regression tests
        run: npm run test:ui

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Verify static export, identity, links, and résumé PDF
        run: npm run verify:export

      - name: Dependency audit
        shell: bash
        run: |
          set +e
          audit_output="$(timeout 120s npm run audit 2>&1)"
          audit_status=$?
          set -e
          printf '%s\n' "$audit_output"

          if [ "$audit_status" -eq 0 ]; then
            exit 0
          fi

          if [ "$audit_status" -eq 124 ] || printf '%s\n' "$audit_output" | grep -Eq 'Service Unavailable|audit endpoint returned an error|ECONNRESET|ETIMEDOUT|EAI_AGAIN'; then
            echo '::warning::npm audit service is temporarily unavailable; CodeQL, Semgrep and Dependabot remain active, so CI will not fail on this external outage.'
            exit 0
          fi

          exit "$audit_status"

      # A successful Next.js compile alone does not prove that interactive routes
      # work. Release artifacts are allowed only after browser acceptance passes.
      - name: Install Playwright test driver
        run: python3 -m pip install --user --disable-pip-version-check playwright==1.56.0

      - name: Install Playwright Chromium and system dependencies
        run: python3 -m playwright install --with-deps chromium

      - name: Install browser accessibility audit engine
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund axe-core@4.10.3

      - name: Start verified static export preview
        shell: bash
        run: |
          nohup npm run preview:export -- --port 4173 --dir out > /tmp/atlas-server.log 2>&1 &
          for attempt in {1..20}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:4173/; then exit 0; fi
            sleep 1
          done
          cat /tmp/atlas-server.log
          exit 1

      - name: Browser interaction, accessibility, and responsive QA
        run: python3 scripts/atlas-browser-qa.py

      - name: Upload release browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hajar-release-browser-evidence-${{ github.run_id }}
          path: atlas-qa-artifacts/
          if-no-files-found: warn
          retention-days: 7

      # Preview artifacts are never consumed by automatic production deployments.
      # Manual runs and PRs can inspect a verified export without touching main.
      - name: Upload verified preview export
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hajar-nextjs-preview-${{ github.sha }}-${{ github.run_id }}
          path: out/
          if-no-files-found: error
          retention-days: 7

      # Only a push to main may produce artifacts used for deployment.
      - name: Upload verified static export
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hajar-nextjs-production-${{ github.sha }}
          path: out/
          if-no-files-found: error
          retention-days: 14

      - name: Upload deployable source
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: portfolio-deploy-source-${{ github.sha }}
          path: |
            out/
            netlify.toml
          if-no-files-found: error
          retention-days: 7
