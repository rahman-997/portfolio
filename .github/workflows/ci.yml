name: Portfolio CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: portfolio-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Use npm 11.19.1
        run: npm install --global npm@11.19.1

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test Atlas contracts and Lighthouse regression-budget logic
        run: node --test scripts/tests/atlas-production-contract.test.mjs scripts/tests/lighthouse-budget.test.mjs scripts/tests/lighthouse-diagnostics.test.mjs scripts/tests/release-candidate.test.mjs scripts/tests/netlify-release-gate.test.mjs

      - name: Production build
        run: npm run build

      - name: Verify static export, identity, links, and résumé PDF
        run: npm run verify:export

      - name: Dependency audit
        shell: bash
        run: |
          set +e
          audit_output="$(timeout 120s npm run audit 2>&1)"
          audit_status=$?
          set -e
          printf '%s\n' "$audit_output"

          if [ "$audit_status" -eq 0 ]; then
            exit 0
          fi

          if [ "$audit_status" -eq 124 ] || printf '%s\n' "$audit_output" | grep -Eq 'Service Unavailable|audit endpoint returned an error|ECONNRESET|ETIMEDOUT|EAI_AGAIN'; then
            echo '::warning::npm audit service is temporarily unavailable; CodeQL, Semgrep and Dependabot remain active, so CI will not fail on this external outage.'
            exit 0
          fi

          exit "$audit_status"

      - name: Verify and package review-only static candidate
        if: github.event_name == 'push' && (github.ref == 'refs/heads/feat/digital-studio-conversion-2026-11-24' || startsWith(github.ref, 'refs/heads/fix/release-delivery-'))
        run: |
          node scripts/release-candidate.mjs create out release-manifest.json "$GITHUB_SHA"
          node scripts/release-candidate.mjs verify out release-manifest.json
          python3 -m http.server 4173 --bind 127.0.0.1 --directory out >/tmp/portfolio-release-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:4173/; then break; fi
            sleep 1
          done
          node scripts/verify-candidate-http.mjs release-manifest.json http://127.0.0.1:4173

      - name: Upload static candidate for owner review (not deployment)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/feat/digital-studio-conversion-2026-11-24' || startsWith(github.ref, 'refs/heads/fix/release-delivery-'))
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: portfolio-review-${{ github.sha }}
          path: |
            out/
            release-manifest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Observe published compression separately from candidate
        if: github.event_name == 'push' && (github.ref == 'refs/heads/feat/digital-studio-conversion-2026-11-24' || startsWith(github.ref, 'refs/heads/fix/release-delivery-'))
        timeout-minutes: 3
        run: |
          python3 -m unittest scripts.tests.test_check_published_delivery
          python3 scripts/check_published_delivery.py delivery-evidence/report.json

      - name: Upload published delivery observation
        if: github.event_name == 'push' && (github.ref == 'refs/heads/feat/digital-studio-conversion-2026-11-24' || startsWith(github.ref, 'refs/heads/fix/release-delivery-'))
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: published-delivery-${{ github.sha }}
          path: delivery-evidence/report.json
          if-no-files-found: error
          retention-days: 7

      - name: Verify production static candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          node scripts/release-candidate.mjs create out release-manifest.json "$GITHUB_SHA"
          node scripts/release-candidate.mjs verify out release-manifest.json

      - name: Upload verified static output (not source)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: portfolio-release-${{ github.sha }}
          path: |
            out/
            release-manifest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
