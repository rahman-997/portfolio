name: Netlify Production Deploy

# Render is the existing primary host. Netlify is an explicit fallback.
on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact current main commit SHA
        required: true
        type: string
      ci_run_id:
        description: Successful Portfolio CI push run ID for that SHA
        required: true
        type: string
      confirm_release:
        description: I authorize production deployment to the existing Netlify site
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: netlify-production
  cancel-in-progress: false

env:
  NETLIFY_SITE_ID: 0ff3c9c1-3912-4b49-b182-fd38194dd02e

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.confirm_release == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout authorized main workflow SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Use pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - name: Verify exact main CI, security, browser and Lighthouse evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.commit_sha }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: |
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ && "$CI_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID" > "$RUNNER_TEMP/release-run.json"
          gh api "repos/$GITHUB_REPOSITORY/branches/main" > "$RUNNER_TEMP/release-main.json"
          for workflow in ci.yml security.yml atlas-browser-qa.yml portfolio-lighthouse.yml; do
            gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs" -f branch=main -f event=push -f head_sha="$RELEASE_SHA" -F per_page=100 > "$RUNNER_TEMP/release-$workflow.json"
          done
          jq -n --slurpfile ci "$RUNNER_TEMP/release-ci.yml.json" --slurpfile security "$RUNNER_TEMP/release-security.yml.json" --slurpfile browser "$RUNNER_TEMP/release-atlas-browser-qa.yml.json" --slurpfile lighthouse "$RUNNER_TEMP/release-portfolio-lighthouse.yml.json" '{".github/workflows/ci.yml":$ci[0],".github/workflows/security.yml":$security[0],".github/workflows/atlas-browser-qa.yml":$browser[0],".github/workflows/portfolio-lighthouse.yml":$lighthouse[0]}' > "$RUNNER_TEMP/release-quality.json"
          node scripts/netlify-release-gate.mjs "$RUNNER_TEMP/release-run.json" "$RUNNER_TEMP/release-main.json" "$RUNNER_TEMP/release-quality.json"
      - name: Validate Netlify credentials
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN || secrets.NETLIFY_TOKEN || secrets.NETLIFY_ACCESS_TOKEN }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::error::Netlify token not configured; no deployment attempted."
            exit 1
          fi
      - name: Download verified static output
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: portfolio-release-${{ inputs.commit_sha }}
          path: .
          run-id: ${{ inputs.ci_run_id }}
          github-token: ${{ github.token }}
      - name: Verify exact payload and recheck current main and latest quality gates
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.commit_sha }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: |
          node scripts/release-candidate.mjs verify out release-manifest.json
          test "$(jq -r .commit release-manifest.json)" = "$RELEASE_SHA"
          gh api "repos/$GITHUB_REPOSITORY/branches/main" > "$RUNNER_TEMP/release-main.json"
          for workflow in ci.yml security.yml atlas-browser-qa.yml portfolio-lighthouse.yml; do
            gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs" -f branch=main -f event=push -f head_sha="$RELEASE_SHA" -F per_page=100 > "$RUNNER_TEMP/release-$workflow.json"
          done
          jq -n --slurpfile ci "$RUNNER_TEMP/release-ci.yml.json" --slurpfile security "$RUNNER_TEMP/release-security.yml.json" --slurpfile browser "$RUNNER_TEMP/release-atlas-browser-qa.yml.json" --slurpfile lighthouse "$RUNNER_TEMP/release-portfolio-lighthouse.yml.json" '{".github/workflows/ci.yml":$ci[0],".github/workflows/security.yml":$security[0],".github/workflows/atlas-browser-qa.yml":$browser[0],".github/workflows/portfolio-lighthouse.yml":$lighthouse[0]}' > "$RUNNER_TEMP/release-quality.json"
          node scripts/netlify-release-gate.mjs "$RUNNER_TEMP/release-run.json" "$RUNNER_TEMP/release-main.json" "$RUNNER_TEMP/release-quality.json"
      - name: Deploy explicitly authorized fallback
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN || secrets.NETLIFY_TOKEN || secrets.NETLIFY_ACCESS_TOKEN }}
          RELEASE_SHA: ${{ inputs.commit_sha }}
        run: |
          npm exec --yes --package=netlify-cli@27.5.0 -- netlify deploy --dir=out --prod --site="$NETLIFY_SITE_ID" --message="GitHub $RELEASE_SHA"
