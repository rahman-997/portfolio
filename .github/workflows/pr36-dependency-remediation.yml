name: One-time portfolio dependency remediation

on:
  push:
    branches:
      - feature/interactive-ai-systems-atlas-20261024

permissions:
  contents: write

jobs:
  remediate:
    if: github.repository == 'rahman-997/portfolio'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Align npm version with project
        run: npm install --global npm@11.19.1
      - name: Upgrade patched framework and dependency tree
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save-exact next@16.4.3 eslint-config-next@16.4.3
          npm audit fix --package-lock-only --ignore-scripts --no-fund
      - name: Install and verify
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm run typecheck
          npm run build
          npm run verify:export
          npm run audit
      - name: Commit verified package updates to feature branch
        run: |
          if ! git diff --quiet -- package.json package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "fix(security): update Next.js and vulnerable transitive dependencies"
            git push origin HEAD:feature/interactive-ai-systems-atlas-20261024
          fi
