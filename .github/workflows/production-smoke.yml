name: Production smoke

on:
  workflow_run:
    workflows: ["Portfolio CI"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-production-smoke
  cancel-in-progress: true

jobs:
  verify-production:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PORTFOLIO_URL: https://abdulrahman-hajar-portfolio.onrender.com
      EXPECTED_GIT_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
      PRODUCTION_RETRIES: "42"
      PRODUCTION_RETRY_DELAY_MS: "10000"
      REQUIRE_SECURITY_HEADERS: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Use npm 11.19.1
        run: npm install --global npm@11.19.1

      - name: Verify deployed portfolio
        run: npm run verify:production
