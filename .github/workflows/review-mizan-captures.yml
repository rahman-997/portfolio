name: Export reviewed Mizan dashboard capture
on:
  push:
    branches: [feat/digital-studio-conversion-2026-11-24]
    paths: [".github/workflows/review-mizan-captures.yml"]
permissions:
  contents: read
  actions: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Retrieve exact inspected screenshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 45493015890 --repo rahman-997/portfolio --name mizan-captures-review-only --dir reviewed
          echo 'e812540bd66598d8019b7b54f4f2a932f97fd0d0582d2366f843bccaa5bd3783  reviewed/mizan-dashboard-review.png' | sha256sum -c -
          python3 - <<'PY'
          import base64
          from pathlib import Path
          data = Path("reviewed/mizan-dashboard-review.png").read_bytes()
          encoded = base64.b64encode(data).decode("ascii")
          for i in range(0, len(encoded), 2000):
              print("MIZAN_PNG_CHUNK:" + str(i//2000).zfill(4) + ":" + encoded[i:i+2000])
          print("MIZAN_PNG_END:" + str(len(encoded)))
          PY
