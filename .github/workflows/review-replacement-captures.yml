name: Export reviewed FitFlow screenshot
on:
  push:
    branches: [feat/digital-studio-conversion-2026-11-24]
    paths: [".github/workflows/review-replacement-captures.yml"]
permissions:
  contents: read
  actions: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch the exact reviewed capture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 45489401075 --repo rahman-997/portfolio --name replacement-captures-review-only --dir reviewed
          echo "e7da382621f3aa025ab283dc99a602c1bcbe1d7129dc90832ca3ab471a4f5a58  reviewed/fitflow-timer-review.png" | sha256sum -c -
      - name: Export reviewed screenshot as optimized WebP
        run: |
          python3 -m pip install --disable-pip-version-check Pillow==11.3.0
          python3 - <<'PY'
          import base64
          import hashlib
          from io import BytesIO
          from PIL import Image
          im = Image.open("reviewed/fitflow-timer-review.png").convert("RGB")
          assert im.size == (1440, 960)
          im.thumbnail((1200, 800), Image.Resampling.LANCZOS)
          buf = BytesIO()
          im.save(buf, format="WEBP", quality=85, method=6)
          data = buf.getvalue()
          assert len(data) < 100000
          encoded = base64.b64encode(data).decode("ascii")
          print("REVIEWED_WEBP_SHA256:" + hashlib.sha256(data).hexdigest())
          for i in range(0, len(encoded), 2000):
              print("REVIEWED_WEBP_CHUNK:" + str(i//2000).zfill(3) + ":" + encoded[i:i+2000])
          print("REVIEWED_WEBP_END:" + str(len(encoded)))
          PY
